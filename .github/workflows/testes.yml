# Roda os testes do painel (contra o Mercado Livre simulado) a cada PR e a cada mudança na main.
# Não usa conta do Mercado Livre nem segredo nenhum.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.x"
          - os: windows-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.x"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Rodar os testes
        run: python -m unittest discover -s testes -v
